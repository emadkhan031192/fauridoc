name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Prepare pinned debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.FAURIDOC_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/fauridoc-debug.key.jks
            echo "pinned debug keystore restored"
          else
            echo "no pinned keystore secret; using default debug signing"
          fi

      - name: Build debug APKs (per ABI)
        env:
          FAURIDOC_DEBUG_KEYSTORE_FILE: ${{ github.workspace }}/android/app/fauridoc-debug.key.jks
          FAURIDOC_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.FAURIDOC_DEBUG_KEYSTORE_PASSWORD }}
          FAURIDOC_DEBUG_KEY_ALIAS: ${{ secrets.FAURIDOC_DEBUG_KEY_ALIAS }}
        run: flutter build apk --debug --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: fauridoc-apks
          path: build/app/outputs/flutter-apk/*.apk
