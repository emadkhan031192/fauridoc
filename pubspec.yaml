name: fauridoc
description: "Fauridoc — find a verified doctor, compare lab test prices, locate the nearest hospital. Instantly."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  google_sign_in: ^6.3.0
  google_maps_flutter: ^2.10.0
  geolocator: ^14.0.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  shared_preferences: ^2.5.3
  intl: any
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon_mark.png
    - assets/seed_data/doctors.json
    - assets/seed_data/labs.json
    - assets/seed_data/hospitals.json
    - assets/seed_data/config.json
  fonts:
    - family: AlbertSans
      fonts:
        - asset: assets/fonts/AlbertSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/AlbertSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/AlbertSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AlbertSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/AlbertSans-ExtraBold.ttf
          weight: 800
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoNastaliqUrdu-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon_mark.png
  min_sdk_android: 23
