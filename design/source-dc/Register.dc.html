<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Register a doctor, lab or hospital</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#F5F7F6}
button{font-family:inherit}
input{font-family:inherit}
textarea{font-family:inherit}
a{text-decoration:none;color:inherit}
.noscroll{scrollbar-width:none}
.noscroll::-webkit-scrollbar{display:none}
.press{transition:transform .08s ease-out;-webkit-tap-highlight-color:transparent}
.press:active{transform:scale(.97)}
.press:focus-visible{outline:2px solid #0B6B5C;outline-offset:2px}
input::placeholder,textarea::placeholder{color:#6B7F7B}
input:focus-visible,textarea:focus-visible{outline:2px solid #0B6B5C;outline-offset:0}
.fld{display:block;box-sizing:border-box;width:100%;height:50px;margin-top:6px;padding:0 14px;border-radius:12px;border:1px solid #D5DEDA;background:#fff;font-size:15px;font-weight:600;color:#0F2A2E}
.lbl{display:block;margin-top:14px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#566B68}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#F5F7F6;color:#0F2A2E;font-family:'Albert Sans',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <div style="flex:none;display:flex;align-items:center;gap:4px;padding:48px 10px 8px 10px">
    <a href="Profile.dc.html" class="press" aria-label="Back to profile" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#0F2A2E">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="font-size:20px;font-weight:800;letter-spacing:-.01em">Add a listing</span>
  </div>

  <div class="noscroll" style="flex:1;min-height:0;overflow-y:auto;padding:4px 20px 20px">

    <div style="display:flex;gap:4px;padding:4px;border-radius:14px;background:#E8EEEC" role="group" aria-label="What are you adding">
      <sc-for list="{{types}}" as="t" hint-placeholder-count="3">
        <button class="press" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="flex:1;height:42px;border:0;border-radius:11px;background:{{t.bg}};color:{{t.fg}};box-shadow:{{t.shadow}};font-size:14px;font-weight:{{t.weight}};padding:0;cursor:pointer">{{t.name}}</button>
      </sc-for>
    </div>

    <span class="lbl">Photos</span>
    <div style="display:flex;gap:8px;margin-top:6px">
      <button class="press" style="flex:1;height:84px;border-radius:14px;border:1.5px dashed #9BB5AD;background:#fff;color:#0B6B5C;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;padding:0;cursor:pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 17a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"></path></svg>
        {{photoMain}}
      </button>
      <sc-for list="{{photoSlots}}" as="s" hint-placeholder-count="3">
        <button class="press" aria-label="{{s.label}}" style="flex:1;height:84px;border-radius:14px;border:1.5px dashed #C9D3CF;background:#fff;color:#6B7F7B;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;padding:0;cursor:pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          Photo {{s.n}}
        </button>
      </sc-for>
    </div>

    <label class="lbl" for="f-name">{{nameLabel}}</label>
    <input id="f-name" class="fld" type="text" placeholder="{{namePh}}">

    <sc-if value="{{isDoctor}}" hint-placeholder-val="{{ true }}">
      <label class="lbl" for="f-spec">Specialization</label>
      <button id="f-spec" class="fld press" style="display:flex;align-items:center;justify-content:space-between;text-align:left;color:#6B7F7B;font-weight:500;cursor:pointer">Choose a specialty<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
      <label class="lbl" for="f-qual">Qualification</label>
      <input id="f-qual" class="fld" type="text" placeholder="MBBS, FCPS...">
      <label class="lbl" for="f-clinic">Hospital or clinic name</label>
      <input id="f-clinic" class="fld" type="text" placeholder="Where do you see patients?">
    </sc-if>

    <label class="lbl" for="f-city">City</label>
    <button id="f-city" class="fld press" style="display:flex;align-items:center;justify-content:space-between;text-align:left;cursor:pointer">Mardan<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>

    <label class="lbl" for="f-addr">Full address</label>
    <textarea id="f-addr" rows="2" placeholder="Street, landmark, area" style="display:block;box-sizing:border-box;width:100%;margin-top:6px;padding:12px 14px;border-radius:12px;border:1px solid #D5DEDA;background:#fff;font-size:15px;font-weight:600;line-height:1.4;color:#0F2A2E;resize:none"></textarea>

    <button class="press" style="display:flex;align-items:center;gap:10px;width:100%;height:52px;margin-top:10px;padding:0 14px;border-radius:12px;border:1.5px solid #0B6B5C;background:#fff;color:#0B6B5C;font-size:14px;font-weight:700;cursor:pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6 7-11a7 7 0 1 0-14 0c0 5 7 11 7 11zM12 12a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"></path></svg>
      Pin the exact location on the map
    </button>

    <label class="lbl" for="f-phone">Phone number</label>
    <input id="f-phone" class="fld" type="tel" inputmode="numeric" placeholder="0937 XXX XXX">

    <sc-if value="{{isDoctor}}" hint-placeholder-val="{{ true }}">
      <label class="lbl" for="f-wa">WhatsApp number</label>
      <input id="f-wa" class="fld" type="tel" inputmode="numeric" placeholder="03XX XXXXXXX">

      <span class="lbl">Languages spoken</span>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px">
        <sc-for list="{{langs}}" as="l" hint-placeholder-count="4">
          <button class="press" aria-pressed="{{l.on}}" onClick="{{l.pick}}" style="height:40px;padding:0 16px;border-radius:20px;border:1px solid {{l.border}};background:{{l.bg}};color:{{l.fg}};font-size:14px;font-weight:600;cursor:pointer">{{l.name}}</button>
        </sc-for>
      </div>

      <span class="lbl">Working days</span>
      <div style="display:flex;gap:6px;margin-top:6px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <button class="press" aria-label="{{d.full}}" aria-pressed="{{d.on}}" onClick="{{d.pick}}" style="flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid {{d.border}};background:{{d.bg}};color:{{d.fg}};font-size:13px;font-weight:700;padding:0;cursor:pointer">{{d.name}}</button>
        </sc-for>
      </div>
      <div style="display:flex;gap:10px">
        <div style="flex:1"><label class="lbl" for="f-from">Opens</label><input id="f-from" class="fld" type="text" placeholder="5:00 PM"></div>
        <div style="flex:1"><label class="lbl" for="f-to">Closes</label><input id="f-to" class="fld" type="text" placeholder="8:00 PM"></div>
      </div>
      <label class="lbl" for="f-fee">Consultation fee (Rs)</label>
      <input id="f-fee" class="fld" type="text" inputmode="numeric" placeholder="1500">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px;min-height:48px">
        <span style="font-size:15px;font-weight:600">Parking available</span>
        <button class="press" role="switch" aria-checked="{{parking}}" aria-label="Parking available" onClick="{{toggleParking}}" style="position:relative;width:52px;height:32px;border:0;border-radius:16px;background:{{parkBg}};padding:0;cursor:pointer"><span style="position:absolute;top:3px;left:{{parkKnob}}px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25)"></span></button>
      </div>
    </sc-if>

    <sc-if value="{{isLab}}" hint-placeholder-val="{{ false }}">
      <span class="lbl">Tests you offer</span>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:6px">
        <div style="display:flex;gap:8px"><input class="fld" aria-label="Test name" type="text" placeholder="Test name, like CBC" style="flex:2;margin-top:0"><input class="fld" aria-label="Price in rupees" type="text" inputmode="numeric" placeholder="Rs" style="flex:1;margin-top:0"></div>
        <button class="press" style="display:flex;align-items:center;justify-content:center;gap:6px;height:46px;border-radius:12px;border:1.5px dashed #9BB5AD;background:#fff;color:#0B6B5C;font-size:14px;font-weight:700;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add another test</button>
      </div>
      <label class="lbl" for="f-hours">Working hours</label>
      <input id="f-hours" class="fld" type="text" placeholder="Mon to Sat, 8 AM to 10 PM">
    </sc-if>

    <sc-if value="{{isHospital}}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px;min-height:48px">
        <span style="font-size:15px;font-weight:600">Emergency ward open 24/7</span>
        <button class="press" role="switch" aria-checked="{{em}}" aria-label="Emergency ward open 24/7" onClick="{{toggleEm}}" style="position:relative;width:52px;height:32px;border:0;border-radius:16px;background:{{emBg}};padding:0;cursor:pointer"><span style="position:absolute;top:3px;left:{{emKnob}}px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25)"></span></button>
      </div>
      <label class="lbl" for="f-emph">Emergency contact number</label>
      <input id="f-emph" class="fld" type="tel" inputmode="numeric" placeholder="0937 XXX XXX">
      <span class="lbl">Departments</span>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px">
        <sc-for list="{{deps}}" as="d" hint-placeholder-count="8">
          <button class="press" aria-pressed="{{d.on}}" onClick="{{d.pick}}" style="height:40px;padding:0 16px;border-radius:20px;border:1px solid {{d.border}};background:{{d.bg}};color:{{d.fg}};font-size:14px;font-weight:600;cursor:pointer">{{d.name}}</button>
        </sc-for>
      </div>
      <label class="lbl" for="f-visit">Visiting hours</label>
      <input id="f-visit" class="fld" type="text" placeholder="Daily, 4 PM to 6 PM">
    </sc-if>
  </div>

  <div style="flex:none;box-sizing:border-box;padding:10px 20px 26px;background:#fff;border-top:1px solid #E1E7E4">
    <div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:10px;font-size:12px;font-weight:500;line-height:1.4;color:#566B68">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A4B00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      Your listing stays hidden until our team checks it. This usually takes a day or two.
    </div>
    <button class="press" style="width:100%;height:54px;border:0;border-radius:27px;background:#0B6B5C;color:#fff;font-size:16px;font-weight:700;cursor:pointer">Submit for approval</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      type: 'doctor',
      langs: { Pashto: true, Urdu: true, English: false, Hindko: false },
      days: [true, true, true, true, false, true, false],
      deps: { Emergency: true, Surgery: true, Cardiology: false, Maternity: false, Pediatrics: false, Orthopedic: false, Radiology: false, ICU: false },
      parking: true,
      em: true
    };
  }
  renderVals() {
    const s = this.state;
    const typeDefs = [['doctor', 'Doctor'], ['lab', 'Lab'], ['hospital', 'Hospital']];
    const chip = (on) => ({ on: on, bg: on ? '#0B6B5C' : '#fff', border: on ? '#0B6B5C' : '#D5DEDA', fg: on ? '#fff' : '#0F2A2E' });
    const dayNames = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
    const dayFull = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    const t = s.type;
    return {
      isDoctor: t === 'doctor', isLab: t === 'lab', isHospital: t === 'hospital',
      types: typeDefs.map((d) => ({
        name: d[1], on: t === d[0],
        bg: t === d[0] ? '#fff' : 'transparent', fg: t === d[0] ? '#0B6B5C' : '#566B68',
        weight: t === d[0] ? 800 : 600, shadow: t === d[0] ? '0 1px 3px rgba(15,42,46,.14)' : 'none',
        pick: () => this.setState({ type: d[0] })
      })),
      photoMain: t === 'doctor' ? 'Your photo' : 'Main photo',
      photoSlots: [1, 2, 3].map((n) => ({ n: n, label: (t === 'doctor' ? 'Clinic photo ' : 'Photo ') + n })),
      nameLabel: t === 'doctor' ? 'Doctor name' : (t === 'lab' ? 'Lab name' : 'Hospital name'),
      namePh: t === 'doctor' ? 'Dr. full name' : (t === 'lab' ? 'Name of the lab' : 'Name of the hospital'),
      langs: Object.keys(s.langs).map((k) => ({ name: k, ...chip(s.langs[k]), pick: () => this.setState({ langs: { ...this.state.langs, [k]: !this.state.langs[k] } }) })),
      days: dayNames.map((n, i) => ({
        name: n, full: dayFull[i], ...chip(s.days[i]),
        pick: () => { const d = this.state.days.slice(); d[i] = !d[i]; this.setState({ days: d }); }
      })),
      parking: s.parking, parkBg: s.parking ? '#0B6B5C' : '#B7C4C0', parkKnob: s.parking ? 23 : 3,
      toggleParking: () => this.setState({ parking: !this.state.parking }),
      em: s.em, emBg: s.em ? '#0B6B5C' : '#B7C4C0', emKnob: s.em ? 23 : 3,
      toggleEm: () => this.setState({ em: !this.state.em }),
      deps: Object.keys(s.deps).map((k) => ({ name: k, ...chip(s.deps[k]), pick: () => this.setState({ deps: { ...this.state.deps, [k]: !this.state.deps[k] } }) }))
    };
  }
}
</script>
</body>
</html>
