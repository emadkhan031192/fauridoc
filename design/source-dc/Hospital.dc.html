<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hospital profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#F5F7F6}
button{font-family:inherit}
a{text-decoration:none;color:inherit}
.noscroll{scrollbar-width:none}
.noscroll::-webkit-scrollbar{display:none}
.press{transition:transform .08s ease-out;-webkit-tap-highlight-color:transparent}
.press:active{transform:scale(.97)}
.press:focus-visible{outline:2px solid #0B6B5C;outline-offset:2px}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#F5F7F6;color:#0F2A2E;font-family:'Albert Sans',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <div class="noscroll" style="flex:1;min-height:0;overflow-y:auto">
    <div style="position:relative;height:150px;background:#F8DDDB;display:flex;align-items:center;justify-content:center;color:#C62828">
      <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity:.4"><path d="M12 5v14M5 12h14"></path></svg>
      <a href="Search.dc.html" class="press" aria-label="Back to search" style="position:absolute;left:14px;top:48px;width:44px;height:44px;border-radius:22px;background:#fff;color:#0F2A2E;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(15,42,46,.18)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
    </div>

    <div style="padding:16px 20px 24px">
      <div style="display:flex;align-items:center;gap:7px">
        <h1 style="margin:0;font-size:25px;line-height:1.15;font-weight:800;letter-spacing:-.02em">Noor General Hospital</h1>
        <svg width="22" height="22" viewBox="0 0 24 24" role="img" aria-label="Verified by Fauridoc" style="flex:none"><circle cx="12" cy="12" r="11" fill="#0B6B5C"></circle><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </div>
      <div style="margin-top:4px;font-size:14px;font-weight:500;color:#566B68">General hospital  ·  Mardan  ·  2.1 km away</div>

      <div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:14px;font-weight:700">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#F5B400" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"></path></svg>
        4.5<span style="font-weight:500;color:#566B68">(402)</span>
        <span style="padding:3px 10px;border-radius:11px;background:#F8DDDB;color:#A11F1F;font-size:12px;font-weight:700">Emergency 24/7</span>
      </div>

      <div style="display:flex;align-items:center;gap:12px;margin-top:14px;padding:14px;border-radius:16px;background:#C62828;color:#fff">
        <span style="flex:none;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.18)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"></path></svg>
        </span>
        <span style="flex:1;display:flex;flex-direction:column">
          <span style="font-size:12px;font-weight:600;opacity:.9">Emergency number</span>
          <span style="font-size:20px;font-weight:800;letter-spacing:.01em">0937 XXX XXX</span>
        </span>
      </div>

      <div style="display:flex;flex-direction:column;margin-top:12px;background:#fff;border:1px solid #E1E7E4;border-radius:16px;padding:0 14px">
        <sc-for list="{{info}}" as="r" hint-placeholder-count="4">
          <div style="display:flex;gap:12px;padding:12px 0;border-bottom:1px solid {{r.line}}">
            <span style="flex:none;width:92px;font-size:13px;font-weight:600;color:#566B68">{{r.k}}</span>
            <span style="flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.35;white-space:pre-line">{{r.v}}</span>
          </div>
        </sc-for>
      </div>

      <h2 style="margin:22px 0 10px;font-size:17px;font-weight:800">Departments</h2>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <sc-for list="{{deps}}" as="d" hint-placeholder-count="8">
          <span style="display:flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:19px;border:1px solid {{d.border}};background:{{d.bg}};color:{{d.fg}};font-size:14px;font-weight:600">{{d.name}}</span>
        </sc-for>
      </div>

      <h2 style="margin:22px 0 10px;font-size:17px;font-weight:800">Location</h2>
      <a href="Map.dc.html" class="press" style="display:block;border-radius:16px;overflow:hidden;border:1px solid #E1E7E4">
        <svg width="350" height="120" viewBox="0 0 350 120" role="img" aria-label="Map preview of the hospital location" style="display:block;width:100%">
          <rect width="350" height="120" fill="#E7EDEA"></rect>
          <path d="M0 30h350M0 86h350M80 0v120M200 0v120M290 0v120" stroke="#fff" stroke-width="9"></path>
          <rect x="100" y="42" width="80" height="34" rx="6" fill="#D5E4DC"></rect><rect x="214" y="96" width="60" height="20" rx="6" fill="#D5E4DC"></rect>
          <path d="M200 58s-13-11-13-23a13 13 0 1 1 26 0c0 12-13 23-13 23z" fill="#C62828"></path>
          <path d="M198 28h4v5h5v4h-5v5h-4v-5h-5v-4h5z" fill="#fff"></path>
        </svg>
        <span style="display:flex;align-items:center;justify-content:space-between;padding:0 14px;height:48px;background:#fff;font-size:14px;font-weight:700;color:#0B6B5C">View on Map<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></span>
      </a>
    </div>
  </div>

  <div style="flex:none;box-sizing:border-box;padding:10px 16px 26px;background:#fff;border-top:1px solid #E1E7E4;display:flex;gap:10px">
    <a href="Emergency.dc.html" class="press" style="flex:1.4;display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:16px;background:#C62828;color:#fff;font-size:15px;font-weight:700">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"></path></svg>
      Call emergency
    </a>
    <a href="Map.dc.html" class="press" style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:16px;border:1.5px solid #0B6B5C;background:#fff;color:#0B6B5C;font-size:15px;font-weight:700">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l16-7-7 16-2-7z"></path></svg>
      Directions
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const info = [
      { k: 'Address', v: 'Bank Road, Mardan' },
      { k: 'Phone', v: '0937 XXX XXX' },
      { k: 'Visiting hours', v: 'Daily  4 PM – 6 PM\nICU  by permission only' },
      { k: 'OPD', v: 'Mon to Sat  9 AM – 2 PM' }
    ];
    const deps = ['Emergency', 'Surgery', 'Cardiology', 'Maternity', 'Pediatrics', 'Orthopedic', 'Radiology', 'ICU'];
    return {
      info: info.map((r, i) => ({ k: r.k, v: r.v, line: i === info.length - 1 ? 'transparent' : '#EEF1F0' })),
      deps: deps.map((d, i) => ({
        name: d,
        bg: i === 0 ? '#F8DDDB' : '#fff',
        border: i === 0 ? '#EBB8B4' : '#E1E7E4',
        fg: i === 0 ? '#A11F1F' : '#0F2A2E'
      }))
    };
  }
}
</script>
</body>
</html>
