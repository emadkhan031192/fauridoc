<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Community</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#F5F7F6}
button{font-family:inherit}
textarea{font-family:inherit}
a{text-decoration:none;color:inherit}
.noscroll{scrollbar-width:none}
.noscroll::-webkit-scrollbar{display:none}
.press{transition:transform .08s ease-out;-webkit-tap-highlight-color:transparent}
.press:active{transform:scale(.96)}
.press:focus-visible{outline:2px solid #0B6B5C;outline-offset:2px}
textarea::placeholder{color:#6B7F7B}
textarea:focus-visible{outline:2px solid #0B6B5C;outline-offset:0}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#F5F7F6;color:#0F2A2E;font-family:'Albert Sans',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <div style="flex:none;padding:52px 20px 0">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:28px;font-weight:800;letter-spacing:-.02em">Community</span>
      <button class="press" onClick="{{openAsk}}" style="display:flex;align-items:center;gap:6px;height:44px;padding:0 18px 0 14px;border:0;border-radius:22px;background:#0B6B5C;color:#fff;font-size:14px;font-weight:700;cursor:pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        Ask
      </button>
    </div>
    <div class="noscroll" style="display:flex;gap:8px;margin:12px -20px 0;padding:0 20px;overflow-x:auto">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
        <span style="flex:none;display:flex;align-items:center;height:36px;padding:0 14px;border-radius:18px;border:1px solid {{c.border}};background:{{c.bg}};color:{{c.fg}};font-size:13px;font-weight:600">{{c.name}}</span>
      </sc-for>
    </div>
  </div>

  <div class="noscroll" style="flex:1;min-height:0;overflow-y:auto;padding:12px 20px 16px">
    <div style="display:flex;flex-direction:column;gap:10px">
      <sc-for list="{{posts}}" as="p" hint-placeholder-count="4">
        <div style="display:flex;gap:8px;padding:12px 12px 12px 6px;border-radius:16px;border:1px solid {{p.border}};background:{{p.bg}}">
          <div style="flex:none;display:flex;flex-direction:column;align-items:center;width:44px">
            <button class="press" aria-label="Upvote" aria-pressed="{{p.upOn}}" onClick="{{p.up}}" style="width:44px;height:36px;border:0;background:transparent;color:{{p.upColor}};display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg>
            </button>
            <span style="font-size:15px;font-weight:800;color:{{p.scoreColor}}">{{p.score}}</span>
            <button class="press" aria-label="Downvote" aria-pressed="{{p.downOn}}" onClick="{{p.down}}" style="width:44px;height:36px;border:0;background:transparent;color:{{p.downColor}};display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
            </button>
          </div>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px">
            <sc-if value="{{p.pinned}}" hint-placeholder-val="{{ false }}">
              <span style="display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:#8A4B00">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l-1 6 3 3H7l3-3zM12 13v7"></path></svg>
                Pinned by Fauridoc team
              </span>
            </sc-if>
            <span style="font-size:16px;font-weight:700;line-height:1.3">{{p.title}}</span>
            <div style="display:flex;flex-wrap:wrap;gap:6px">
              <sc-for list="{{p.tags}}" as="t" hint-placeholder-count="2"><span style="padding:2px 9px;border-radius:10px;background:#EEF1F0;font-size:12px;font-weight:600;color:#2E4744">{{t}}</span></sc-for>
            </div>
            <sc-if value="{{p.hasReply}}" hint-placeholder-val="{{ false }}">
              <div style="padding:10px 12px;border-radius:12px;background:#E4F3EF;display:flex;flex-direction:column;gap:3px">
                <span style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#0B5446">{{p.replyBy}}<span style="padding:1px 8px;border-radius:9px;background:#0B6B5C;color:#fff;font-size:11px;font-weight:700">Doctor</span></span>
                <span style="font-size:13px;font-weight:500;line-height:1.45;color:#1F4A41">{{p.reply}}</span>
              </div>
            </sc-if>
            <span style="font-size:12px;font-weight:500;color:#566B68">{{p.by}}  ·  {{p.when}}  ·  {{p.replies}} replies</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="flex:none;height:84px;box-sizing:border-box;background:#fff;border-top:1px solid #E1E7E4;display:flex;justify-content:space-around;align-items:flex-start;padding:8px 8px 0">
    <a href="Main.dc.html" class="press" style="width:68px;color:#566B68;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600">
      <span style="display:flex;align-items:center;justify-content:center;width:52px;height:30px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4zM10 20v-6h4v6"></path></svg></span>Home
    </a>
    <a href="Search.dc.html" class="press" style="width:68px;color:#566B68;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600">
      <span style="display:flex;align-items:center;justify-content:center;width:52px;height:30px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"></path></svg></span>Search
    </a>
    <a href="Map.dc.html" class="press" style="width:68px;color:#566B68;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600">
      <span style="display:flex;align-items:center;justify-content:center;width:52px;height:30px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6 7-11a7 7 0 1 0-14 0c0 5 7 11 7 11zM12 12a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"></path></svg></span>Map
    </a>
    <a href="Community.dc.html" class="press" style="width:68px;color:#0B6B5C;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700">
      <span style="display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:15px;background:#DDF0EA"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h12v9H9l-4 3v-3H4zM16 9h4v8h-1v3l-3-3h-5v-2"></path></svg></span>Community
    </a>
    <a href="Profile.dc.html" class="press" style="width:68px;color:#566B68;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600">
      <span style="display:flex;align-items:center;justify-content:center;width:52px;height:30px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 4-6 8-6s8 2 8 6"></path></svg></span>Profile
    </a>
  </div>

  <sc-if value="{{asking}}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(15,42,46,.45)"></div>
    <div role="dialog" aria-label="Ask a question" style="position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;padding:18px 20px 30px;border-radius:24px 24px 0 0;background:#fff;box-shadow:0 -10px 40px rgba(15,42,46,.25)">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <span style="font-size:20px;font-weight:800">Ask the community</span>
        <button class="press" aria-label="Close" onClick="{{closeAsk}}" style="width:44px;height:44px;margin-right:-10px;border:0;background:transparent;color:#0F2A2E;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
      <textarea aria-label="Your question" placeholder="For example: which skin specialist is good in Mardan?" rows="3" style="display:block;box-sizing:border-box;width:100%;margin-top:8px;padding:12px;border-radius:12px;border:1px solid #D5DEDA;background:#F5F7F6;font-size:15px;font-weight:500;line-height:1.4;color:#0F2A2E;resize:none"></textarea>
      <div style="margin-top:12px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#566B68">City</div>
      <div style="display:flex;gap:8px;margin-top:6px">
        <span style="display:flex;align-items:center;height:36px;padding:0 14px;border-radius:18px;background:#0F2A2E;color:#fff;font-size:13px;font-weight:600">Mardan</span>
        <span style="display:flex;align-items:center;height:36px;padding:0 14px;border-radius:18px;border:1px solid #E1E7E4;font-size:13px;font-weight:600">Peshawar</span>
        <span style="display:flex;align-items:center;height:36px;padding:0 14px;border-radius:18px;border:1px solid #E1E7E4;font-size:13px;font-weight:600">Swabi</span>
        <span style="display:flex;align-items:center;height:36px;padding:0 14px;border-radius:18px;border:1px solid #E1E7E4;font-size:13px;font-weight:600">More</span>
      </div>
      <div style="margin-top:12px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#566B68">Specialty</div>
      <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap">
        <span style="display:flex;align-items:center;height:36px;padding:0 14px;border-radius:18px;background:#0F2A2E;color:#fff;font-size:13px;font-weight:600">Dermatologist</span>
        <span style="display:flex;align-items:center;height:36px;padding:0 14px;border-radius:18px;border:1px solid #E1E7E4;font-size:13px;font-weight:600">Pediatrician</span>
        <span style="display:flex;align-items:center;height:36px;padding:0 14px;border-radius:18px;border:1px solid #E1E7E4;font-size:13px;font-weight:600">Lab tests</span>
      </div>
      <button class="press" onClick="{{closeAsk}}" style="margin-top:18px;width:100%;height:52px;border:0;border-radius:26px;background:#0B6B5C;color:#fff;font-size:16px;font-weight:700;cursor:pointer">Post question</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { asking: false, votes: { p2: 1 } };
  }
  renderVals() {
    const { asking, votes } = this.state;
    const names = ['All', 'Mardan', 'Dermatologist', 'Lab tests', 'Pediatrician', 'Gynecologist', 'Heart'];
    const base = [
      { id: 'p1', pinned: true, title: 'Welcome to Fauridoc Community. Ask kindly, answer honestly.', tags: ['All cities', 'Announcement'], by: 'Fauridoc team', when: '2 weeks ago', replies: 3, score: 41 },
      { id: 'p2', title: 'Where can I find a good skin specialist in Mardan?', tags: ['Mardan', 'Dermatologist'], by: 'Adnan R.', when: '3 hours ago', replies: 6, score: 23, reply: 'Happy to see you at my clinic on Hospital Road. Please bring any older prescriptions with you.', replyBy: 'Dr. Zarmina Gul' },
      { id: 'p3', title: 'Which lab is cheapest for a thyroid profile near Mardan?', tags: ['Mardan', 'Lab tests'], by: 'Gul Z.', when: 'Yesterday', replies: 4, score: 18 },
      { id: 'p4', title: 'Is there a children’s doctor who sees patients on Sunday?', tags: ['Mardan', 'Pediatrician'], by: 'Samina T.', when: '2 days ago', replies: 2, score: 9 }
    ];
    const setVote = (id, v) => this.setState({ votes: { ...this.state.votes, [id]: (this.state.votes[id] === v ? 0 : v) } });
    return {
      asking: asking,
      openAsk: () => this.setState({ asking: true }),
      closeAsk: () => this.setState({ asking: false }),
      chips: names.map((n, i) => ({ name: n, bg: i === 0 ? '#0F2A2E' : '#fff', border: i === 0 ? '#0F2A2E' : '#E1E7E4', fg: i === 0 ? '#fff' : '#0F2A2E' })),
      posts: base.map((p) => {
        const v = votes[p.id] || 0;
        return {
          title: p.title, tags: p.tags, by: p.by, when: p.when, replies: p.replies,
          pinned: !!p.pinned, hasReply: !!p.reply, reply: p.reply || '', replyBy: p.replyBy || '',
          bg: p.pinned ? '#FFF8EC' : '#fff', border: p.pinned ? '#F4D9B2' : '#E1E7E4',
          score: p.score + v,
          scoreColor: v === 1 ? '#0B6B5C' : (v === -1 ? '#A11F1F' : '#0F2A2E'),
          upOn: v === 1, downOn: v === -1,
          upColor: v === 1 ? '#0B6B5C' : '#7B8E8A', downColor: v === -1 ? '#A11F1F' : '#7B8E8A',
          up: () => setVote(p.id, 1), down: () => setVote(p.id, -1)
        };
      })
    };
  }
}
</script>
</body>
</html>
