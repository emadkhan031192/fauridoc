<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Map</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#E7EDEA}
button{font-family:inherit}
a{text-decoration:none;color:inherit}
.noscroll{scrollbar-width:none}
.noscroll::-webkit-scrollbar{display:none}
.press{transition:transform .08s ease-out;-webkit-tap-highlight-color:transparent}
.press:active{transform:scale(.96)}
.press:focus-visible{outline:2px solid #0F2A2E;outline-offset:2px}
.pin{transition:width .15s ease-out,height .15s ease-out,margin .15s ease-out}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#E7EDEA;color:#0F2A2E;font-family:'Albert Sans',system-ui,sans-serif;overflow:hidden">

  <svg width="390" height="760" viewBox="0 0 390 760" aria-hidden="true" style="position:absolute;left:0;top:0">
    <rect width="390" height="760" fill="#E7EDEA"></rect>
    <rect x="20" y="170" width="90" height="70" rx="8" fill="#D5E4DC"></rect><rect x="150" y="120" width="70" height="56" rx="8" fill="#D5E4DC"></rect><rect x="250" y="250" width="110" height="60" rx="8" fill="#D5E4DC"></rect><rect x="40" y="470" width="80" height="90" rx="8" fill="#D5E4DC"></rect><rect x="230" y="560" width="120" height="80" rx="8" fill="#D5E4DC"></rect>
    <path d="M-10 260H400M-10 400H400M-10 540H400M80 80V780M190 80V780M300 80V780" stroke="#fff" stroke-width="12"></path>
    <path d="M-10 640L160 480 400 330" stroke="#fff" stroke-width="8" fill="none"></path>
    <path d="M0 600c60-30 90 10 150-10s100-60 240-30" stroke="#C7DCE8" stroke-width="14" fill="none" stroke-linecap="round" opacity=".7"></path>
    <circle cx="190" cy="400" r="34" fill="#2F6BFF" opacity=".14"></circle><circle cx="190" cy="400" r="9" fill="#fff"></circle><circle cx="190" cy="400" r="6.5" fill="#2F6BFF"></circle>
  </svg>

  <sc-for list="{{pins}}" as="p" hint-placeholder-count="6">
    <button class="press pin" aria-label="{{p.label}}" aria-pressed="{{p.on}}" onClick="{{p.pick}}" style="position:absolute;left:{{p.x}}px;top:{{p.y}}px;width:{{p.size}}px;height:{{p.size}}px;margin:{{p.off}}px 0 0 {{p.off}}px;border-radius:50%;border:3px solid #fff;background:{{p.bg}};color:#fff;box-shadow:{{p.shadow}};display:{{p.display}};align-items:center;justify-content:center;padding:0;cursor:pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.d}}"></path></svg>
    </button>
  </sc-for>

  <div style="position:absolute;left:0;right:0;top:0;padding:48px 16px 0;pointer-events:none">
    <div style="display:flex;gap:8px;pointer-events:auto">
      <button class="press" aria-label="Change city, Mardan" style="flex:1;display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;border-radius:24px;border:0;background:#fff;color:#0F2A2E;font-size:15px;font-weight:700;box-shadow:0 2px 10px rgba(15,42,46,.16);cursor:pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B6B5C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6 7-11a7 7 0 1 0-14 0c0 5 7 11 7 11zM12 12a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"></path></svg>
        Mardan
        <span style="flex:1"></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <a href="Search.dc.html" class="press" aria-label="Search" style="flex:none;width:48px;height:48px;border-radius:24px;background:#fff;color:#0F2A2E;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(15,42,46,.16)">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"></path></svg>
      </a>
    </div>
    <div class="noscroll" style="display:flex;gap:8px;margin:10px -16px 0;padding:0 16px;overflow-x:auto;pointer-events:auto">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button class="press" aria-pressed="{{f.on}}" onClick="{{f.pick}}" style="flex:none;display:flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:19px;border:0;background:{{f.bg}};color:{{f.fg}};font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(15,42,46,.14);cursor:pointer">
          <span style="width:10px;height:10px;border-radius:50%;background:{{f.dot}}"></span>{{f.name}}
        </button>
      </sc-for>
    </div>
  </div>

  <button class="press" aria-label="Centre on my location" style="position:absolute;right:16px;top:536px;width:48px;height:48px;border-radius:24px;border:0;background:#fff;color:#2F6BFF;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(15,42,46,.18);cursor:pointer;padding:0">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path><circle cx="12" cy="12" r="7.5"></circle></svg>
  </button>

  <a href="{{card.href}}" class="press" style="position:absolute;left:12px;right:12px;bottom:96px;display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:#fff;box-shadow:0 6px 24px rgba(15,42,46,.2)">
    <span style="flex:none;display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:14px;background:{{card.tint}};color:{{card.ink}}">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{card.d}}"></path></svg>
    </span>
    <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
      <span style="font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{card.name}}</span>
      <span style="font-size:12.5px;font-weight:600;color:#566B68">{{card.type}}  ·  {{card.dist}} km</span>
      <span style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700">
        <span style="display:flex;align-items:center;gap:3px"><svg width="13" height="13" viewBox="0 0 24 24" fill="#F5B400" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"></path></svg>{{card.rating}}</span>
        <span style="color:#0B6B5C">{{card.line}}</span>
      </span>
    </span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#566B68" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
  </a>

  <div style="position:absolute;left:0;right:0;bottom:0;height:84px;box-sizing:border-box;background:#fff;border-top:1px solid #E1E7E4;display:flex;justify-content:space-around;align-items:flex-start;padding:8px 8px 0">
    <a href="Main.dc.html" class="press" style="width:68px;color:#566B68;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600">
      <span style="display:flex;align-items:center;justify-content:center;width:52px;height:30px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4zM10 20v-6h4v6"></path></svg></span>Home
    </a>
    <a href="Search.dc.html" class="press" style="width:68px;color:#566B68;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600">
      <span style="display:flex;align-items:center;justify-content:center;width:52px;height:30px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"></path></svg></span>Search
    </a>
    <a href="Map.dc.html" class="press" style="width:68px;color:#0B6B5C;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700">
      <span style="display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:15px;background:#DDF0EA"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6 7-11a7 7 0 1 0-14 0c0 5 7 11 7 11zM12 12a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"></path></svg></span>Map
    </a>
    <a href="Community.dc.html" class="press" style="width:68px;color:#566B68;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600">
      <span style="display:flex;align-items:center;justify-content:center;width:52px;height:30px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h12v9H9l-4 3v-3H4zM16 9h4v8h-1v3l-3-3h-5v-2"></path></svg></span>Community
    </a>
    <a href="Profile.dc.html" class="press" style="width:68px;color:#566B68;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600">
      <span style="display:flex;align-items:center;justify-content:center;width:52px;height:30px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 4-6 8-6s8 2 8 6"></path></svg></span>Profile
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all', sel: 'h1' };
  }
  renderVals() {
    const { filter, sel } = this.state;
    const T = {
      doctor: { bg: '#0B6B5C', tint: '#DDF0EA', ink: '#0B5446', d: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 4-6 8-6s8 2 8 6', name: 'Doctor', href: 'Doctor.dc.html' },
      lab: { bg: '#3552D6', tint: '#E3E9FF', ink: '#2B3F9E', d: 'M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3M8 15h8', name: 'Lab', href: 'Lab.dc.html' },
      hospital: { bg: '#C62828', tint: '#F8DDDB', ink: '#C62828', d: 'M12 5v14M5 12h14', name: 'Hospital', href: 'Hospital.dc.html' }
    };
    const data = [
      { id: 'd1', t: 'doctor', name: 'Dr. Sana Yousafzai', x: 120, y: 250, dist: '1.2', rating: '4.9', line: 'Fee Rs 1,500  ·  Parking available' },
      { id: 'd2', t: 'doctor', name: 'Dr. Imran Khattak', x: 262, y: 330, dist: '2.8', rating: '4.8', line: 'Fee Rs 2,000  ·  No parking' },
      { id: 'l1', t: 'lab', name: 'Hayat Diagnostics', x: 84, y: 430, dist: '1.5', rating: '4.7', line: 'CBC Rs 450  ·  Parking available' },
      { id: 'l2', t: 'lab', name: 'Prime Lab Mardan', x: 300, y: 196, dist: '2.2', rating: '4.8', line: 'CBC Rs 600  ·  Parking available' },
      { id: 'h1', t: 'hospital', name: 'Noor General Hospital', x: 196, y: 478, dist: '2.1', rating: '4.5', line: 'Emergency open 24/7' },
      { id: 'h2', t: 'hospital', name: 'Green Valley Hospital', x: 308, y: 540, dist: '3.0', rating: '4.3', line: 'Emergency open 24/7' }
    ];
    const show = (p) => filter === 'all' || filter === p.t;
    const cur = data.find((p) => p.id === sel) || data[4];
    const filtersDef = [['all', 'All', '#0F2A2E'], ['doctor', 'Doctors', '#0B6B5C'], ['lab', 'Labs', '#3552D6'], ['hospital', 'Hospitals', '#C62828']];
    return {
      pins: data.map((p) => {
        const on = p.id === sel;
        const size = on ? 54 : 44;
        return {
          label: T[p.t].name + ': ' + p.name,
          on: on,
          x: p.x, y: p.y, size: size, off: -size / 2,
          bg: T[p.t].bg, d: T[p.t].d,
          shadow: on ? '0 0 0 5px rgba(15,42,46,.18),0 4px 12px rgba(15,42,46,.3)' : '0 2px 8px rgba(15,42,46,.3)',
          display: show(p) ? 'flex' : 'none',
          pick: () => this.setState({ sel: p.id })
        };
      }),
      filters: filtersDef.map((f) => ({
        name: f[1], on: filter === f[0], dot: f[2],
        bg: filter === f[0] ? '#0F2A2E' : '#fff', fg: filter === f[0] ? '#fff' : '#0F2A2E',
        pick: () => this.setState({ filter: f[0] })
      })),
      card: {
        name: cur.name, type: T[cur.t].name, dist: cur.dist, rating: cur.rating, line: cur.line,
        tint: T[cur.t].tint, ink: T[cur.t].ink, d: T[cur.t].d, href: T[cur.t].href
      }
    };
  }
}
</script>
</body>
</html>
