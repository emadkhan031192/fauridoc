<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#F5F7F6}
button{font-family:inherit}
a{text-decoration:none;color:inherit}
.press{transition:transform .08s ease-out;-webkit-tap-highlight-color:transparent}
.press:active{transform:scale(.97)}
.press:focus-visible{outline:2px solid #0B6B5C;outline-offset:2px}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#F5F7F6;color:#0F2A2E;font-family:'Albert Sans',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;padding:48px 24px 40px">

  <div style="display:flex;justify-content:flex-end;height:44px;align-items:center">
    <a href="Main.dc.html" class="press" style="display:flex;align-items:center;height:44px;padding:0 6px;font-size:15px;font-weight:700;color:#566B68">Skip</a>
  </div>

  <div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center">
    <sc-if value="{{s0}}" hint-placeholder-val="{{ true }}">
      <svg width="320" height="260" viewBox="0 0 300 240" role="img" aria-label="A verified doctor card with a five star rating">
        <circle cx="150" cy="120" r="112" fill="#DDF0EA"></circle>
        <rect x="58" y="48" width="172" height="120" rx="16" fill="#fff" stroke="#C9D3CF" transform="rotate(-7 144 108)"></rect>
        <rect x="76" y="68" width="172" height="124" rx="16" fill="#fff" stroke="#0B6B5C" stroke-width="1.5"></rect>
        <circle cx="110" cy="104" r="21" fill="#FFE6D2"></circle>
        <path d="M110 98a6 6 0 1 0 0.1 0zM98 118c2-8 22-8 24 0" fill="#8A3F00"></path>
        <rect x="142" y="92" width="76" height="9" rx="4.5" fill="#0F2A2E"></rect>
        <rect x="142" y="110" width="52" height="7" rx="3.5" fill="#C9D3CF"></rect>
        <circle cx="98" cy="156" r="5.5" fill="#F5B400"></circle><circle cx="114" cy="156" r="5.5" fill="#F5B400"></circle><circle cx="130" cy="156" r="5.5" fill="#F5B400"></circle><circle cx="146" cy="156" r="5.5" fill="#F5B400"></circle><circle cx="162" cy="156" r="5.5" fill="#E1E7E4"></circle>
        <rect x="182" y="148" width="50" height="16" rx="8" fill="#E4F3EF"></rect>
        <circle cx="244" cy="74" r="18" fill="#0B6B5C"></circle>
        <path d="M236 74.5l5.5 5.5L252 69" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </sc-if>
    <sc-if value="{{s1}}" hint-placeholder-val="{{ false }}">
      <svg width="320" height="260" viewBox="0 0 300 240" role="img" aria-label="Three labs compared by price for the same test">
        <circle cx="150" cy="120" r="112" fill="#FFE6D2"></circle>
        <rect x="52" y="52" width="196" height="40" rx="12" fill="#fff" stroke="#E1E7E4"></rect>
        <rect x="52" y="100" width="196" height="40" rx="12" fill="#fff" stroke="#0B6B5C" stroke-width="2"></rect>
        <rect x="52" y="148" width="196" height="40" rx="12" fill="#fff" stroke="#E1E7E4"></rect>
        <circle cx="76" cy="72" r="10" fill="#E3E9FF"></circle><circle cx="76" cy="120" r="10" fill="#DDF0EA"></circle><circle cx="76" cy="168" r="10" fill="#F8E1EC"></circle>
        <rect x="96" y="66" width="62" height="8" rx="4" fill="#C9D3CF"></rect><rect x="96" y="114" width="62" height="8" rx="4" fill="#0F2A2E"></rect><rect x="96" y="162" width="62" height="8" rx="4" fill="#C9D3CF"></rect>
        <text x="236" y="77" text-anchor="end" font-family="Albert Sans" font-size="15" font-weight="700" fill="#566B68">Rs 700</text>
        <text x="236" y="125" text-anchor="end" font-family="Albert Sans" font-size="16" font-weight="800" fill="#0B6B5C">Rs 450</text>
        <text x="236" y="173" text-anchor="end" font-family="Albert Sans" font-size="15" font-weight="700" fill="#566B68">Rs 600</text>
        <rect x="190" y="88" width="62" height="18" rx="9" fill="#FF7A1A"></rect>
        <text x="221" y="101" text-anchor="middle" font-family="Albert Sans" font-size="10.5" font-weight="800" fill="#2A1300">LOWEST</text>
      </svg>
    </sc-if>
    <sc-if value="{{s2}}" hint-placeholder-val="{{ false }}">
      <svg width="320" height="260" viewBox="0 0 300 240" role="img" aria-label="A hospital pin with an emergency cross on a map">
        <circle cx="150" cy="120" r="112" fill="#F8DDDB"></circle>
        <circle cx="150" cy="128" r="84" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="3 6"></circle>
        <circle cx="150" cy="128" r="52" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="3 6"></circle>
        <path d="M150 190s-40-34-40-70a40 40 0 1 1 80 0c0 36-40 70-40 70z" fill="#C62828"></path>
        <path d="M144 100h12v14h14v12h-14v14h-12v-14h-14v-12h14z" fill="#fff"></path>
        <circle cx="64" cy="152" r="9" fill="#0B6B5C"></circle><circle cx="238" cy="164" r="9" fill="#0B6B5C"></circle><circle cx="214" cy="84" r="9" fill="#FF7A1A"></circle>
        <rect x="204" y="190" width="58" height="22" rx="11" fill="#fff"></rect>
        <text x="233" y="205" text-anchor="middle" font-family="Albert Sans" font-size="12" font-weight="800" fill="#0F2A2E">2.1 km</text>
      </svg>
    </sc-if>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px;min-height:128px">
    <h1 style="margin:0;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.025em">{{title}}</h1>
    <p style="margin:0;font-size:16px;line-height:1.5;font-weight:500;color:#566B68">{{body}}</p>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;margin-top:24px">
    <div style="display:flex;gap:8px" aria-label="Step {{stepText}}">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="3">
        <span style="display:block;height:8px;width:{{d.w}}px;border-radius:4px;background:{{d.bg}}"></span>
      </sc-for>
    </div>
    <sc-if value="{{notLast}}" hint-placeholder-val="{{ true }}">
      <button class="press" onClick="{{next}}" style="display:flex;align-items:center;gap:8px;height:52px;padding:0 26px;border:0;border-radius:26px;background:#0B6B5C;color:#fff;font-size:16px;font-weight:700;cursor:pointer">
        Next
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </button>
    </sc-if>
    <sc-if value="{{isLast}}" hint-placeholder-val="{{ false }}">
      <a href="Main.dc.html" class="press" style="display:flex;align-items:center;height:52px;padding:0 26px;border-radius:26px;background:#0B6B5C;color:#fff;font-size:16px;font-weight:700">Get started</a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0 };
  }
  renderVals() {
    const i = this.state.i;
    const slides = [
      { t: 'Find a verified doctor', b: 'Every doctor is checked by our team before they appear. Pick by specialty, city and real patient ratings.' },
      { t: 'Compare lab test prices', b: 'See which lab nearby offers your test, and what it costs, before you walk in and overpay.' },
      { t: 'Nearest hospital, fast', b: 'One tap shows the closest hospital with emergency service, its phone number and directions.' }
    ];
    return {
      s0: i === 0, s1: i === 1, s2: i === 2,
      title: slides[i].t,
      body: slides[i].b,
      stepText: String(i + 1) + ' of 3',
      notLast: i < 2,
      isLast: i === 2,
      dots: [0, 1, 2].map((n) => ({ w: n === i ? 26 : 8, bg: n === i ? '#0B6B5C' : '#C9D3CF' })),
      next: () => this.setState({ i: Math.min(2, this.state.i + 1) })
    };
  }
}
</script>
</body>
</html>
